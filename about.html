<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>About Us | Julius Care</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial, sans-serif;
color:#222;
background:#ffffff;
}


/* HEADER */

header{

background:#0B3D91;
padding:20px 8%;
display:flex;
justify-content:space-between;
align-items:center;

}


header img{

width:120px;

}


nav{

display:flex;
align-items:center;
gap:25px;

}


nav a{

color:white;
text-decoration:none;
font-weight:700;

}


.nav-button{

background:#2A9D8F;
padding:12px 25px;
border-radius:30px;

}


/* HERO */

.hero{

background:#eef8ff;
padding:90px 12%;
text-align:center;

}


.hero h1{

font-size:50px;
font-weight:900;
color:#0B3D91;

}


.hero p{

max-width:850px;
margin:25px auto;
font-size:20px;
font-weight:700;
line-height:1.8;

}



/* ABOUT */

.about{

padding:80px 12%;
text-align:center;

}


.about h2{

font-size:42px;
font-weight:900;
color:#0B3D91;

}


.about p{

margin-top:25px;
font-size:20px;
font-weight:700;
line-height:1.8;

}


/* ABOUT IMAGE */

.about-image{

padding:20px 12% 80px;
text-align:center;

}


.about-image img{

width:100%;
max-width:900px;
height:450px;
object-fit:cover;
border-radius:25px;

}



/* MISSION */

.mission{

display:flex;
gap:30px;
padding:60px 8%;

}


.card{

flex:1;
background:#eef8ff;
padding:40px;
border-radius:20px;
text-align:center;

}


.card h3{

font-size:30px;
font-weight:900;
color:#0B3D91;

}


.card p{

margin-top:20px;
font-size:18px;
font-weight:700;
line-height:1.6;

}
